[project]
name = "camera-sync"
version = "1.0.0"
description = "Multi-camera video synchronization using flash detection with GPU-accelerated rendering"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["."]

[project.scripts]
sync-videos = "sync_videos:main"
